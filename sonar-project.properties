# SonarQube Project Configuration
## Project Key and Organization
sonar.projectKey=SandroThimoteo_Desafio_Itau_V2
sonar.organization=sandrothimoteo

## Project Metadata
sonar.projectName=Compra Programada - Itau V2
sonar.projectVersion=1.0.0
sonar.projectDescription=Sistema de Compra Programada de Acoes para Itau Corretora

## Source Code
sonar.sources=src
sonar.tests=tests
sonar.test.inclusions=**/*Tests.cs,**/*Test.cs

## C# Language Settings
sonar.language=csharp
sonar.sourceEncoding=UTF-8

## Code Coverage
sonar.cs.opencover.reportsPaths=**/coverage.cobertura.xml
sonar.coverage.exclusions=**/*Tests.cs,**/*Test.cs,**/bin/**,**/obj/**

## Exclusions
sonar.exclusions=**/bin/**,**/obj/**,**/*.csproj,**/node_modules/**
sonar.coverage.exclusions=**/bin/**,**/obj/**,**/*Tests.cs

## General Settings
sonar.qualitygate.wait=false
sonar.links.homepage=https://github.com/SandroThimoteo/Desafio_Itau_V2
sonar.links.ci=https://github.com/SandroThimoteo/Desafio_Itau_V2/actions
sonar.links.scm=https://github.com/SandroThimoteo/Desafio_Itau_V2

## Issue Detection
sonar.csharp.roslyn.reportFilePaths=**/*CodeAnalysisReport.json
