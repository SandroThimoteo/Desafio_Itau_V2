name: Build, Test & Code Quality

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

env:
  DOTNET_VERSION: '8.0.x'

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for SonarQube

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Run tests with coverage
        run: |
          dotnet test --configuration Release --no-build \
            --verbosity normal \
            --logger "xunit;LogFileName=test-results.xml" \
            /p:CollectCoverage=true \
            /p:CoverageFormat=cobertura \
            /p:CoverageFileName=coverage.cobertura.xml \
            /p:Exclude="[*.Tests]*"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: '**/test-results.xml'

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports
          path: '**/coverage.cobertura.xml'

      - name: Archive coverage reports for SonarQube
        run: |
          find . -name "coverage.cobertura.xml" -type f \
            | tar czf coverage-reports.tar.gz -T -

      - name: SonarQube Scan
        if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
        uses: SonarSource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: |
            -Dsonar.projectKey=SandroThimoteo_Desafio_Itau_V2
            -Dsonar.organization=sandrothimoteo

      - name: Print Test Summary
        if: always()
        run: |
          echo "## 🧪 Test Results" >> $GITHUB_STEP_SUMMARY
          if [ -f "tests/CompraProgramada.Tests/test-results.xml" ]; then
            echo "✅ Tests executed successfully" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Check test pass/fail
        run: |
          if dotnet test --no-build --configuration Release --verbosity quiet > /dev/null 2>&1; then
            echo "✅ All tests passed"
            exit 0
          else
            echo "❌ Some tests failed"
            exit 1
          fi
